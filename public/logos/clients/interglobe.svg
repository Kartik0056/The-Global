<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 75" width="100%" height="100%">
  <!-- InterGlobe 5-Star Burst Icon -->
  <g transform="translate(18, 8)">
    <!-- Yellow / Gold ray -->
    <line x1="12" y1="2" x2="25" y2="35" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
    <!-- Orange ray -->
    <line x1="28" y1="16" x2="24" y2="35" stroke="#F97316" stroke-width="4" stroke-linecap="round" />
    <!-- Purple ray -->
    <line x1="48" y1="20" x2="24" y2="35" stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round" />
    <!-- Green ray -->
    <line x1="46" y1="42" x2="24" y2="35" stroke="#84CC16" stroke-width="4" stroke-linecap="round" />
    <!-- Pink / Magenta ray -->
    <line x1="2" y1="38" x2="24" y2="35" stroke="#EC4899" stroke-width="4" stroke-linecap="round" />
    <!-- Cyan / Blue ray -->
    <line x1="10" y1="58" x2="24" y2="35" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- INTERGLOBE Text -->
  <g transform="translate(78, 12)">
    <text x="0" y="38" fill="#FFFFFF" font-family="'Century Gothic', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="2.5">INTERGLOBE</text>
  </g>
</svg>