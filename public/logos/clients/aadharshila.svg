<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Ondine LT Std';
        src: local('Ondine LT Std'), local('OndineLTStd-Regular'), local('Ondine');
      }
      .aadharshila-text {
        font-family: 'Ondine LT Std', 'Fondamento', 'Almendra', 'Brush Script MT', 'Lucida Calligraphy', cursive;
        font-size: 35px;
        fill: #bdbcba;
      }
    </style>
  </defs>

  <!-- Uploaded Aadharshila Red 'A' Icon Emblem -->
  <g transform="translate(12, 6)">
    <image href="data:image/png;base64," x="0" y="0" width="37" height="52" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- aadharshila text styled with Ondine LT Std, font-size:35px, color:#bdbcba -->
  <text x="58" y="42" class="aadharshila-text">aadharshila</text>
</svg>
