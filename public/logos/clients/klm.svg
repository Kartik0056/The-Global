<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- KLM Royal Dutch Airlines Crown & Typography -->
  <g transform="translate(14, 8)">
    <!-- Crown 4 Dots -->
    <circle cx="4" cy="4" r="2" fill="#00A1DE"/>
    <circle cx="12" cy="4" r="2" fill="#00A1DE"/>
    <circle cx="20" cy="4" r="2" fill="#00A1DE"/>
    <circle cx="28" cy="4" r="2" fill="#00A1DE"/>
    <!-- Crown Cross / Center -->
    <path d="M16 0 L16 3 M14.5 1.5 L17.5 1.5" stroke="#00A1DE" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Crown Diadem Arches -->
    <path d="M2 9 C8 15, 24 15, 30 9 L28 15 L4 15 Z" fill="#00A1DE"/>
    <!-- Crown Base Band -->
    <rect x="3" y="17" width="26" height="3" rx="1" fill="#00A1DE"/>
    <!-- Striped accents on base -->
    <circle cx="8" cy="18.5" r="0.8" fill="#FFFFFF"/>
    <circle cx="16" cy="18.5" r="0.8" fill="#FFFFFF"/>
    <circle cx="24" cy="18.5" r="0.8" fill="#FFFFFF"/>
  </g>
  <!-- KLM Bold Text -->
  <text x="56" y="34" font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#00A1DE" letter-spacing="1">KLM</text>
  <!-- Royal Dutch Airlines subtext -->
  <text x="130" y="27" font-family="'Helvetica Neue', sans-serif" font-weight="600" font-size="8.5" fill="#FFFFFF" letter-spacing="0.5">Royal Dutch</text>
  <text x="130" y="37" font-family="'Helvetica Neue', sans-serif" font-weight="600" font-size="8.5" fill="#FFFFFF" letter-spacing="0.5">Airlines</text>
</svg>
