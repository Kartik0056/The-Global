<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" width="100%" height="100%">
  <!-- Horus Falcon Head Emblem -->
  <g fill="#FDB813" transform="translate(245, 8)">
    <path d="M0,8 C8,-2 22,-3 35,4 C45,10 52,21 54,32 C54,34 50,37 46,37 C42,37 38,33 36,30 C30,22 22,17 12,17 C6,17 2,20 0,22 Z" />
    <path d="M12,24 C22,24 30,30 33,38 C35,44 32,50 26,52 C20,54 13,50 10,44 C7,38 8,30 12,24 Z" fill="#FFFFFF" />
    <path d="M18,31 C22,31 25,34 25,38 C25,42 22,45 18,45 C14,45 11,42 11,38 C11,34 14,31 18,31 Z" fill="#0284C7" />
    <path d="M38,36 C44,36 49,41 49,47 C49,53 44,57 37,56 C31,55 26,50 27,44 C27,40 32,36 38,36 Z" />
