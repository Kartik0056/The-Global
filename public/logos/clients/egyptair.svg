  </g>
  <!-- Star Alliance 5-point Star Cluster -->
  <g fill="#E2E8F0" transform="translate(225, 61) scale(0.65)">
    <polygon points="12,0 14,8 22,8 15,13 18,21 12,16 6,21 9,13 2,8 10,8" />
  </g>
